[project]
name = "known-secret-guard"
version = "0.2.0"
description = "Egress check for secrets you already know: catches base64/URL/hex/HTML/split variants that pattern scanners miss."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "LeeGyeongPil", email = "50697071+LeeGyeongPil@users.noreply.github.com" }
]
keywords = ["secrets", "security", "llm", "agents", "prompt-injection", "exfiltration", "pretooluse-hook", "agent-hooks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/known-secret-guard"
Issues = "https://github.com/LeeGyeongPil/known-secret-guard/issues"

[project.scripts]
known-secret-guard = "known_secret_guard.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
